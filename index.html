<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GANGS OF LAGOS</title>
    <style>
        body {
            background-color: #09090b;
            color: #ffffff;
            font-family: -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .hud {
            background-color: #0c0c0e;
            border-bottom: 1px solid #27272a;
            padding: 12px 16px;
            display: none;
            justify-content: space-between;
            align-items: center;
        }
        .hud-logo { font-weight: 900; color: #eab308; font-size: 14px; }
        .stat-badge {
            background: #18181b;
            border: 1px solid #27272a;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 800;
        }
        .content {
            flex: 1;
            padding: 16px;
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        .card {
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .card-title { font-size: 12px; font-weight: 800; color: #a1a1aa; text-transform: uppercase; margin-bottom: 6px; }
        .card-value { font-size: 20px; font-weight: 900; margin: 2px 0 8px 0; }
        .btn {
            background-color: #eab308;
            color: #000000;
            border: none;
            padding: 14px 16px;
            font-weight: 900;
            font-size: 14px;
            border-radius: 6px;
            width: 100%;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }
        .btn-secondary { background-color: #27272a; color: white; border: 1px solid #3f3f46; }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: #0c0c0e;
            border-top: 1px solid #27272a;
            display: none;
            grid-template-cols: repeat(3, 1fr);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            color: #71717a;
            cursor: pointer;
        }
        .nav-item.active { color: #eab308; }
    </style>
</head>
<body>

    <!-- Stats HUD -->
    <header class="hud" id="main-hud">
        <div class="hud-logo">GANGS OF LAGOS</div>
        <div style="display: flex; gap: 8px;">
            <div class="stat-badge" style="color: #ef4444;" id="hud-heat">⚠️ 0%</div>
            <div class="stat-badge" style="color: #22c55e;" id="hud-cash">₦50,000</div>
        </div>
    </header>

    <div class="content">

        <!-- SCREEN 1: PROFILE SELECTION -->
        <section class="screen active" id="screen-onboarding">
            <div class="card" style="text-align: center; margin-top: 20px;">
                <h1 style="color: #eab308; font-weight: 900;">GANGS OF LAGOS</h1>
                <p style="color: #a1a1aa;">Choose a profile to enter the game universe.</p>
                
                <button class="btn" onclick="startGame('LAPO')">
                    <span>🩸 Lapo Route (Hustler)</span>
                    <span>₦50k</span>
                </button>
                <button class="btn btn-secondary" onclick="startGame('NEPO')">
                    <span>💎 Nepo Baby (Elite)</span>
                    <span>₦5M</span>
                </button>
            </div>
        </section>

        <!-- SCREEN 2: MAINLAND GRIND -->
        <section class="screen" id="screen-mainland">
            <div class="card">
                <div class="card-title">📍 Current Location</div>
                <div class="card-value" id="loc-text">Mushin Trenches</div>
            </div>
            <div class="card">
                <div class="card-title">Mainland Hustles</div>
                <button class="btn" onclick="runHustle('extort')">💵 Tax Market Vendors (+₦75k)</button>
                <button class="btn" onclick="runHustle('smuggle')">🌉 Run Third Mainland Bridge</button>
            </div>
        </section>

        <!-- SCREEN 3: ARMORY -->
        <section class="screen" id="screen-market">
            <div class="card">
                <div class="card-title">🔫 Black Market Armory</div>
                <button class="btn btn-secondary" onclick="buyWeapon('AK-47')">Buy AK-47 Crate (₦1.2M)</button>
            </div>
            <div class="card">
                <div class="card-title">🎒 Inventory</div>
                <div id="inv-box" style="font-size: 13px; color: #a1a1aa;">No weapons loaded.</div>
            </div>
        </section>

        <!-- SCREEN 4: LAUNDERING -->
        <section class="screen" id="screen-island">
            <div class="card">
                <div class="card-title">🏝️ Island Laundering</div>
                <div class="card-value" style="color: #22c55e;" id="clean-box">₦0 Cleaned</div>
                <button class="btn" onclick="cleanMoney()">🏢 Buy Ibeju Land (Clean ₦1M)</button>
            </div>
        </section>

    </div>

    <!-- Navigation Tab Bar -->
    <nav class="nav-bar" id="main-nav">
        <div class="nav-item active" id="tab-mainland" onclick="goTab('mainland')">🏢 Mainland</div>
        <div class="nav-item" id="tab-market" onclick="goTab('market')">🛍️ Armory</div>
        <div class="nav-item" id="tab-island" onclick="goTab('island')">🏝️ Island</div>
    </nav>

    <!-- ROBUST SCRIPT ENGINE -->
    <script>
        var playerMoney = 0;
        var playerHeat = 0;
        var playerClean = 0;
        var playerAssets = [];

        function startGame(profileType) {
            // Assign starting stats
            if (profileType === 'NEPO') {
                playerMoney = 5000000;
                playerHeat = 30;
            } else {
                playerMoney = 50000;
                playerHeat = 0;
            }

            // Unhide game layers directly
            document.getElementById('screen-onboarding').style.display = 'none';
            document.getElementById('main-hud').style.display = 'flex';
            document.getElementById('main-nav').style.display = 'grid';
            
            // Activate core screen view
            document.getElementById('screen-mainland').style.display = 'block';
            
            refreshUI();
        }

        function refreshUI() {
            document.getElementById('hud-cash').innerText = "₦" + playerMoney.toLocaleString();
            document.getElementById('hud-heat').innerText = "⚠️ " + playerHeat + "%";
            document.getElementById('clean-box').innerText = "₦" + playerClean.toLocaleString() + " Cleaned";

            var invBox = document.getElementById('inv-box');
            if (playerAssets.length > 0) {
                invBox.innerText = playerAssets.join(', ');
            }
        }

        function goTab(tabId) {
            // Hide all gaming screens
            document.getElementById('screen-mainland').style.display = 'none';
            document.getElementById('screen-market').style.display = 'none';
            document.getElementById('screen-island').style.display = 'none';

            // Show active screen selection
            document.getElementById('screen-' + tabId).style.display = 'block';

            // Reset tab highlights
            document.getElementById('tab-mainland').className = 'nav-item';
            document.getElementById('tab-market').className = 'nav-item';
            document.getElementById('tab-island').className = 'nav-item';
            
            document.getElementById('tab-' + tabId).className = 'nav-item active';
        }

        function runHustle(action) {
            if (action === 'extort') {
                playerMoney += 75000;
                playerHeat = Math.min(100, playerHeat + 2);
                alert("Market tax collected! +₦75,000");
                refreshUI();
            } else if (action === 'smuggle') {
                var locLabel = document.getElementById('loc-text');
                locLabel.innerText = "🚨 Driving across the Bridge...";

                // Network tracking layout check
                fetch('/api/smuggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ playerId: '1' })
                })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.success) {
                        playerMoney += 1200000;
                        playerHeat = Math.min(100, playerHeat + 10);
                        alert(data.message);
                    } else {
                        playerMoney = Math.max(0, playerMoney - 300000);
                        playerHeat = Math.min(100, playerHeat + 20);
                        alert(data.message + " Paid bail.");
                    }
                    locLabel.innerText = "Mushin Trenches";
                    refreshUI();
                })
                .catch(function() {
                    // Offline fallback simulation loop
                    playerMoney += 1200000;
playerHeat = Math.min(100, playerHeat + 10);
alert("Bridge cleared safely! +₦1,200,000");
locLabel.innerText = "Mushin Trenches";
refreshUI();
});
}
}
function buyWeapon(name) {
if (playerMoney < 1200000) {
alert("Baga! Not enough money.");
return;
}
playerMoney -= 1200000;
playerAssets.push(name);
alert("Weapon locked in: " + name);
refreshUI();
}
function cleanMoney() {
if (playerMoney < 1000000) {
alert("You need at least ₦1,000,000 to purchase Land.");
return;
}
playerMoney -= 1000000;
playerClean += 850000;
playerHeat = Math.max(0, playerHeat - 15);
alert("Transaction cleared! Capital laundered.");
refreshUI();
}
